<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="landing" aria-label="Landing">
      <div class="portal-layer" aria-hidden="true"></div>
      <img src="Info_bar.png" alt="Info bar" class="info-bar-image">
      <header>
        <img src="about_me.png" alt="About Me" class="about-me-image">
      </header>
      <h1 class="pigeon-name">
        <img src="better_pigeon.png" alt="pigeon_" class="pigeon-image">
      </h1>
    </section>

    <section class="frame1" aria-label="Frame 1 slide">
      <img src="text1.png" alt="Text overlay" class="text1-image" aria-hidden="true">
      <div class="frame-images" aria-hidden="true">
        <img src="01.png" alt="" class="frame-extra left one" data-target-image="layout1.png">
        <img src="02.png" alt="" class="frame-extra two" data-target-image="layout2.png">
        <img src="03.png" alt="" class="frame-extra left down three" data-target-image="layout3.png">
        <img src="04.png" alt="" class="frame-extra four" data-target-image="layout5.png">
      </div>
    </section>

    <section class="extra-space" aria-label="Extended scroll space"></section>

    <section class="bottom-gallery is-hidden" aria-label="Bottom gallery">
      <img src="layout1.png" alt="Layout 1" class="bottom-image layout-image is-active" data-image="layout1.png">
      <img src="layout2.png" alt="Layout 2" class="bottom-image layout-image is-hidden" data-image="layout2.png">
      <img src="layout3.png" alt="Layout 3" class="bottom-image layout-image is-hidden" data-image="layout3.png">
      <img src="layout5.png" alt="Layout 5" class="bottom-image layout-image is-hidden" data-image="layout5.png">
      <img src="button1.png" alt="Button 1" class="layout-button is-hidden" data-for-image="layout1.png">
      <img src="button2.png" alt="Button 2" class="layout-button is-hidden" data-for-image="layout1.png">
      <img src="button1.png" alt="Button 1" class="layout-button is-hidden" data-for-image="layout2.png">
      <img src="button2.png" alt="Button 2" class="layout-button is-hidden" data-for-image="layout2.png">
      <img src="button1.png" alt="Button 1" class="layout-button is-hidden" data-for-image="layout3.png">
      <img src="button2.png" alt="Button 2" class="layout-button is-hidden" data-for-image="layout3.png">
      <!-- Art overlays for each layout (stacked, only one visible at a time) -->
      <img src="art1.png" alt="Art 1" class="layout-art is-hidden" data-for-image="layout1.png" data-index="1">
      <img src="art2.png" alt="Art 2" class="layout-art is-hidden" data-for-image="layout1.png" data-index="2">
      <img src="art3.png" alt="Art 3" class="layout-art is-hidden" data-for-image="layout1.png" data-index="3">
      <img src="art4.png" alt="Art 4" class="layout-art is-hidden" data-for-image="layout1.png" data-index="4">

      <img src="art1.png" alt="Art 1" class="layout-art is-hidden" data-for-image="layout2.png" data-index="1">
      <img src="art2.png" alt="Art 2" class="layout-art is-hidden" data-for-image="layout2.png" data-index="2">
      <img src="art3.png" alt="Art 3" class="layout-art is-hidden" data-for-image="layout2.png" data-index="3">
      <img src="art4.png" alt="Art 4" class="layout-art is-hidden" data-for-image="layout2.png" data-index="4">

      <img src="art1.png" alt="Art 1" class="layout-art is-hidden" data-for-image="layout3.png" data-index="1">
      <img src="art2.png" alt="Art 2" class="layout-art is-hidden" data-for-image="layout3.png" data-index="2">
      <img src="art3.png" alt="Art 3" class="layout-art is-hidden" data-for-image="layout3.png" data-index="3">
      <img src="art4.png" alt="Art 4" class="layout-art is-hidden" data-for-image="layout3.png" data-index="4">
      <img src="MUSICBOX1.png" alt="Music box 1" class="bottom-image musicbox-image is-hidden" data-image="MUSICBOX1.png">
      <img src="MUSIC1.png" alt="Music 1" class="bottom-image music-image is-hidden" data-image="MUSIC1.png">
    </section>
  </main>

  <audio id="drop-audio" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
